name: Nettalco Image

# Archivo propio del fork. Los workflows de upstream siguen desactivados: publican a
# dokploy/dokploy en Docker Hub con secretos que no tenemos.
on:
  push:
    branches: [canary]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dokploy

permissions:
  contents: read
  packages: write

concurrency:
  group: nettalco-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El Dockerfile espera .env.production; nuestra plantilla trae el branding Nettalco.
      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # El tag movil 'canary' es el que sigue el servidor; el del sha permite volver atras.
          tags: |
            ${{ env.IMAGE }}:canary
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
